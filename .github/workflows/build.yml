name: Build XoXe APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract sprite pack
        run: |
          mkdir -p app/src/main/assets
          unzip -q topdown-shooter.zip -d app/src/main/assets/kenney
          echo "=== PNG files (first 60) ==="
          find app/src/main/assets/kenney -name "*.png" | head -60
          echo "=== dirs ==="
          find app/src/main/assets/kenney -maxdepth 3 -type d | sort | head -40
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XoXe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
